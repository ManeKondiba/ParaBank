# Override with -Dkey=value or PARABANK_KEY_NAME environment variables.
appUrl=https://parabank.parasoft.com/parabank/index.htm
browser=chrome
headless=false
browser.binary=
remote.url=
# Optional Grid platformName; local runs use the current operating system.
os=
timeout.explicit.seconds=15
timeout.pageLoad.seconds=45
timeout.script.seconds=30
window.width=1440
window.height=1000
# Blank uses independent built-in data. Excel is opt-in for maintained test accounts.
testdata.login.path=
testdata.login.sheet=Sheet1

# API tests use a controlled deployment and never start a browser.
api.baseUrl=http://localhost:8081/parabank/services/bank
api.environment=local
api.fixture.mode=web
api.fixture.file=
api.connectTimeout.seconds=10
api.readTimeout.seconds=30
api.server.timezone=UTC
api.account.minimumBalance=100.00
# Exact deployment response codes; characterized by scripts/start-parabank.ps1.
api.status.invalidLogin=400
api.status.missingResource=400
api.status.invalidInput=404
api.status.unsupportedMediaType=415

# TransferFunds UI pilot: ui (browser provisioning) or api (HTTP provisioning).
ui.fixture.mode=ui
