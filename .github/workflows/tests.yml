name: ParaBank tests
on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_ui:
        description: Run Chrome smoke tests against an isolated local ParaBank instance
        type: boolean
        default: false
      run_hybrid_ui:
        description: Run transfer UI pilot with HTTP provisioning on an isolated deployment
        type: boolean
        default: false
      api_suite:
        description: API suite against a fresh local ParaBank instance
        type: choice
        options: [smoke, regression, none]
        default: smoke
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile UI and API tests
        run: bash mvnw --batch-mode --no-transfer-progress -DskipTests verify
      - name: Run framework unit tests
        run: bash mvnw --batch-mode --no-transfer-progress -Dgroups=Unit verify
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: framework-unit-results
          path: |
            target/surefire-reports/
          if-no-files-found: warn
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Chrome smoke tests on isolated ParaBank
        shell: powershell
        env:
          PARABANK_APP_URL: http://127.0.0.1:8081/parabank/index.htm
          PARABANK_HEADLESS: 'true'
          PARABANK_UI_FIXTURE_MODE: ui
        run: |
          try {
            ./scripts/start-parabank.ps1
            ./mvnw.cmd -B -ntp -Psmoke verify
            if ($LASTEXITCODE -ne 0) { throw 'UI smoke verification failed.' }
          } finally {
            ./scripts/stop-parabank.ps1
          }
      - name: Stop isolated ParaBank
        if: always()
        shell: powershell
        run: ./scripts/stop-parabank.ps1
      - name: Capture sanitized ParaBank logs
        if: always()
        shell: powershell
        run: ./scripts/capture-api-logs.ps1
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ui-results
          path: |
            target/api-evidence/application-logs/
            target/surefire-reports/
            target/reports/
            target/browser-diagnostics/
            screenshots/
            target/logs/
  api:
    if: github.event_name != 'workflow_dispatch' || inputs.api_suite != 'none'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run API tests
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_API_SUITE: ${{ inputs.api_suite }}
          PARABANK_API_BASE_URL: http://127.0.0.1:8081/parabank/services/bank
        run: |
          $group = 'ApiSmoke'
          if ($env:EVENT_NAME -eq 'schedule' -or $env:SELECTED_API_SUITE -eq 'regression') {
            $group = 'ApiRegression'
          }
          try {
            ./scripts/start-parabank.ps1
            ./mvnw.cmd -B -ntp -Papi "-Dgroups=$group" verify
            if ($LASTEXITCODE -ne 0) { throw 'API verification failed.' }
          } finally {
            ./scripts/stop-parabank.ps1
          }
      - name: Stop isolated ParaBank
        if: always()
        shell: powershell
        run: ./scripts/stop-parabank.ps1
      - name: Capture sanitized ParaBank logs
        if: always()
        shell: powershell
        run: ./scripts/capture-api-logs.ps1
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: api-results
          path: |
            target/surefire-reports/
            target/reports/
            target/api-evidence/
          if-no-files-found: warn

  hybrid-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.run_hybrid_ui
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Transfer UI pilot with HTTP provisioning and two workers
        shell: powershell
        env:
          PARABANK_APP_URL: http://127.0.0.1:8081/parabank/index.htm
          PARABANK_API_BASE_URL: http://127.0.0.1:8081/parabank/services/bank
          PARABANK_UI_FIXTURE_MODE: api
          PARABANK_HEADLESS: 'true'
        run: |
          # Keep the server's parent PowerShell alive for the complete test run.
          try {
            ./scripts/start-parabank.ps1
            ./mvnw.cmd -B -ntp "-Dgroups=TransferFunds,BankingSmoke,Sanity" "-Dui.threads=2" verify
            if ($LASTEXITCODE -ne 0) { throw 'API-backed UI verification failed.' }
          } finally {
            ./scripts/stop-parabank.ps1
          }
      - name: Stop isolated ParaBank
        if: always()
        shell: powershell
        run: ./scripts/stop-parabank.ps1
      - name: Capture sanitized ParaBank logs
        if: always()
        shell: powershell
        run: ./scripts/capture-api-logs.ps1
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: hybrid-ui-results
          path: |
            target/surefire-reports/
            target/reports/
            target/api-evidence/
            target/browser-diagnostics/
            screenshots/
            target/logs/
          if-no-files-found: warn
